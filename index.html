<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1420">
  <title>James Houston | Cybersecurity</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #18243a 0%, transparent 38%),
        linear-gradient(145deg, #080d16 0%, #0d1420 100%);
      color: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 34px 26px 22px;
      text-align: center;
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid #263348;
      border-radius: 28px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.42);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #3b82f6;
    }

    .avatar {
      width: 94px;
      height: 94px;
      margin: 0 auto 17px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #18243a, #111827);
      border: 3px solid #3b82f6;
      box-shadow:
        0 8px 26px rgba(59, 130, 246, 0.24),
        inset 0 0 0 5px #111827;
      color: #60a5fa;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.7px;
      color: #f8fafc;
    }

    .title {
      margin: 8px 0 26px;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 500;
    }

    .links {
      display: grid;
      gap: 11px;
    }

    .link {
      width: 100%;
      min-height: 54px;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .link:hover {
      transform: translateY(-1px);
    }

    .contact {
      border: 1px solid #3b82f6;
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 9px 22px rgba(37, 99, 235, 0.28);
    }

    .contact:hover {
      background: #1d4ed8;
    }

    .resume {
      border: 1px solid #514b7a;
      background: #201d35;
      color: #c4b5fd;
    }

    .linkedin {
      border: 1px solid #245b8f;
      background: #10263d;
      color: #60a5fa;
    }

    .github {
      border: 1px solid #374151;
      background: #1a202b;
      color: #e5e7eb;
    }

    .footer {
      margin-top: 23px;
      padding-top: 17px;
      border-top: 1px solid #263348;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.1px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card {
        animation: fadeIn 0.25s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar">JH</div>

    <h1>James Houston</h1>
    <div class="title">Cybersecurity Student · IT Support</div>

    <div class="links">

      <!-- Add to Contacts: downloads James Houston vCard -->
      <button type="button" class="link contact" onclick="downloadContact()">
        Add to Contacts
      </button>

      <!-- Resume: opens the PDF stored in this repository -->
      <a
        class="link resume"
        href="./James-Houston-Resume.pdf"
        target="_blank"
        rel="noopener noreferrer"
      >
        Resume
      </a>

      <!-- LinkedIn: James Houston's LinkedIn profile -->
      <a
        class="link linkedin"
        href="https://www.linkedin.com/in/james-houston-361b56286/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>

      <!-- GitHub / Portfolio: actual GitHub profile -->
      <a
        class="link github"
        href="https://github.com/houstjam"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub / Portfolio
      </a>

    </div>

    <div class="footer">
      CompTIA Security+ · Cybersecurity · Networking · Security Operations
    </div>
  </main>

  <script>
    function downloadContact() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:James Houston",
        "TEL;TYPE=CELL:+18043054798",
        "EMAIL:houston804@icloud.com",
        "URL:https://houstjam.github.io/Contact-Card/",
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob([vcard], {
        type: "text/vcard;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "James-Houston.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
