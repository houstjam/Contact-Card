<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>James Houston | Cybersecurity</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f5f7fb;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
      padding: 30px 22px 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
    }

    .accent {
      width: 52px;
      height: 5px;
      margin: 0 auto 22px;
      border-radius: 99px;
      background: #2563eb;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.6px;
    }

    .title {
      margin: 8px 0 26px;
      color: #2563eb;
      font-size: 15px;
      font-weight: 600;
    }

    .links {
      display: grid;
      gap: 10px;
    }

    a, button {
      width: 100%;
      min-height: 50px;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .primary {
      border: 0;
      background: #2563eb;
      color: #ffffff;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .secondary {
      border: 1px solid #dbe3ef;
      background: #f8fafc;
      color: #111827;
    }

    .secondary:hover {
      background: #f1f5f9;
    }

    .footer {
      margin-top: 22px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card {
        animation: fadeIn 0.25s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="accent"></div>

    <h1>James Houston</h1>
    <div class="title">Cybersecurity Student · IT Support</div>

    <div class="links">
      <button class="primary" onclick="downloadContact()">＋ Add to Contacts</button>

      <a class="secondary" href="James-Houston-Resume.pdf">
        Resume
      </a>

      <a class="secondary"
         href="https://www.linkedin.com/in/james-houston-361b56286/"
         target="_blank"
         rel="noopener noreferrer">
        LinkedIn
      </a>

      <a class="secondary"
         href="https://github.com/houstjam"
         target="_blank"
         rel="noopener noreferrer">
        GitHub / Portfolio
      </a>
    </div>

    <div class="footer">
      CompTIA Security+ · Cybersecurity · Networking · Security Operations
    </div>
  </main>

  <script>
    function downloadContact() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:James Houston",
        "TEL;TYPE=CELL:+18043054798",
        "EMAIL:houston804@icloud.com",
        "URL:https://houstjam.github.io/Contact-Card/",
        "END:VCARD"
      ].join("\\r\\n");

      const blob = new Blob([vcard], {
        type: "text/vcard;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "James-Houston.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
