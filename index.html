<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>James Houston - Contact Card</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, #18243a 0%, transparent 38%),
      linear-gradient(145deg, #080d16 0%, #0d1420 100%);
    color: #f4f7fb;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(17, 24, 39, .96);
    border: 1px solid #263348;
    border-radius: 28px;
    padding: 34px 26px 22px;
    box-shadow: 0 24px 65px rgba(0,0,0,.42);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: #3b82f6;
  }
  .avatar {
    width: 94px;
    height: 94px;
    margin: 0 auto 17px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #18243a, #111827);
    border: 3px solid #3b82f6;
    box-shadow: 0 8px 26px rgba(59,130,246,.24), inset 0 0 0 5px #111827;
    color: #60a5fa;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -.7px;
    color: #f8fafc;
  }
  .subtitle {
    margin: 8px 0 26px;
    color: #94a3b8;
    font-size: 15px;
    font-weight: 500;
  }
  .links {
    display: grid;
    gap: 11px;
  }
  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 650;
    transition: .15s ease;
  }
  .contact {
    background: #2563eb;
    border: 1px solid #3b82f6;
    color: #fff;
    box-shadow: 0 9px 22px rgba(37,99,235,.28);
  }
  .resume {
    background: #201d35;
    border: 1px solid #514b7a;
    color: #c4b5fd;
  }
  .linkedin {
    background: #10263d;
    border: 1px solid #245b8f;
    color: #60a5fa;
  }
  .github {
    background: #1a202b;
    border: 1px solid #374151;
    color: #e5e7eb;
  }
  .link:hover { transform: translateY(-1px); }
  .footer {
    margin-top: 23px;
    padding-top: 17px;
    border-top: 1px solid #263348;
    color: #64748b;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: .1px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">JH</div>
    <h1>James Houston</h1>
    <div class="subtitle">Cybersecurity Student · IT Support</div>

    <div class="links">
      <a class="link contact" href="James-Houston-Resume.pdf">Add to Contacts</a>
      <a class="link resume" href="https://www.linkedin.com/in/james-houston-361b56286/" target="_blank" rel="noopener noreferrer">Resume</a>
      <a class="link linkedin" href="https://github.com/houstjam" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a class="link github" href="#">GitHub / Portfolio</a>
    </div>

    <div class="footer">
      CompTIA Security+ · Cybersecurity · Networking · Security Operations
    </div>
  </main>

  <script>
    function downloadContact() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:James Houston",
        "TEL;TYPE=CELL:+18043054798",
        "EMAIL:houston804@icloud.com",
        "URL:https://houstjam.github.io/Contact-Card/",
        "END:VCARD"
      ].join("\\r\\n");

      const blob = new Blob([vcard], {
        type: "text/vcard;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "James-Houston.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
